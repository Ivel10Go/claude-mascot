<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Claude Mascot</title>
<style>
  :root {
    --bg: #1b1815;
    --panel: #262119;
    --line: #3a332a;
    --ink: #ece5d8;
    --dim: #a1978a;
    --body: #d97757;
    --warn: #e0a355;
    --bad: #d9584f;
    --ok: #7fb069;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  .sub { color: var(--dim); margin: 0 0 18px; font-size: 12px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--dim); margin: 0 0 12px; font-weight: 600;
  }
  .gauges { display: flex; gap: 8px; justify-content: space-around; }
  .gauge { text-align: center; }
  .gauge svg { display: block; }
  .gauge .val { font-size: 17px; font-weight: 600; margin-top: -46px; margin-bottom: 30px; }
  .gauge .cap { font-size: 11px; color: var(--dim); }
  .gauge .sub2 { font-size: 10px; color: var(--dim); font-family: Consolas, monospace; }
  .rows { display: grid; gap: 7px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row .k { flex: 0 0 74px; color: var(--dim); font-size: 12px; }
  .row .v { flex: 0 0 88px; text-align: right; font-family: Consolas, monospace; font-size: 12px; }
  .bar { flex: 1; height: 7px; background: #171410; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--body); border-radius: 4px; }
  .stale { opacity: 0.4; }
  .note { color: var(--dim); font-size: 11px; margin-top: 10px; }
  .feed { font-family: Consolas, monospace; font-size: 11.5px; color: var(--dim); }
  .feed b { color: var(--ink); font-weight: 500; }
  label.opt { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; }
  label.opt span { flex: 1; }
  select, input[type=number] {
    background: #171410; color: var(--ink); border: 1px solid var(--line);
    border-radius: 5px; padding: 3px 6px; font: inherit;
  }
  .warnbox {
    border-left: 3px solid var(--warn); padding: 8px 12px; margin-top: 12px;
    background: #2e2418; border-radius: 0 6px 6px 0; font-size: 12px;
  }
  .warnbox.info { border-left-color: var(--body); background: #2a211c; }
  .warnbox b { color: var(--ink); }
  code { background: #171410; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }

  .wide { margin-top: 14px; }
  .cols { display: grid; gap: 18px 26px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
  .cols h3 {
    font-size: 11px; margin: 0 0 8px; color: var(--dim); font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .checks label {
    display: flex; align-items: center; gap: 8px; padding: 3px 0;
    cursor: pointer; font-size: 12px;
  }
  .checks label span { flex: 1; }
  .checks label em {
    font-style: normal; color: var(--dim); font-size: 10.5px;
    font-family: Consolas, monospace;
  }
  .bulk { display: flex; gap: 8px; margin: 14px 0 0; }
  .bulk button {
    background: #171410; color: var(--dim); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 10px; font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .bulk button:hover { color: var(--ink); border-color: var(--body); }
  input[type=range] { width: 120px; accent-color: var(--body); }
  .slider { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .slider span { flex: 1; }
  .slider output { width: 38px; text-align: right; font-family: Consolas, monospace; font-size: 12px; }
</style>
</head>
<body>
  <h1>Claude Mascot</h1>
  <p class="sub" id="headline">Waiting for data…</p>

  <div class="grid">
    <div class="panel">
      <h2>Claude limits</h2>
      <div class="gauges">
        <div class="gauge" id="g-5h"></div>
        <div class="gauge" id="g-7d"></div>
        <div class="gauge" id="g-ctx"></div>
      </div>
      <div id="limits-note" class="note"></div>
    </div>

    <div class="panel">
      <h2>Usage</h2>
      <div class="rows" id="usage"></div>
      <div class="note">Cost is what these tokens would cost at API rates. On a
        subscription no money moves per token.</div>
    </div>

    <div class="panel">
      <h2>Machine</h2>
      <div class="rows" id="machine"></div>
    </div>

    <div class="panel">
      <h2>Disks</h2>
      <div class="rows" id="disks"></div>
    </div>

    <div class="panel">
      <h2>Right now</h2>
      <div class="feed" id="feed"></div>
    </div>

    <div class="panel">
      <h2>Settings</h2>
      <label class="opt"><span>Language</span>
        <select id="s-locale"><option value="de">Deutsch</option><option value="en">English</option></select>
      </label>
      <label class="opt" id="row-display" hidden><span>Screen</span>
        <select id="s-display"></select>
      </label>
      <label class="opt"><span>Mascots <em id="pets-hint"></em></span>
        <input type="number" id="s-pets" min="1" max="8" step="1">
      </label>
      <label class="opt"><span>Speech bubbles</span>
        <input type="checkbox" id="s-muted"><span style="flex:0">mute</span>
      </label>
      <label class="opt"><span>Walk on window edges</span>
        <input type="checkbox" id="s-edges">
      </label>
      <label class="opt"><span>Start with Windows</span>
        <input type="checkbox" id="s-autostart">
      </label>
      <div class="slider"><span id="l-scale">Size</span>
        <input type="range" id="s-scale" min="0.5" max="2.5" step="0.1">
        <output id="o-scale"></output>
      </div>
      <div class="slider"><span id="l-speed">Speed</span>
        <input type="range" id="s-speed" min="0.4" max="2.5" step="0.1">
        <output id="o-speed"></output>
      </div>
      <div id="hooks-warning"></div>
    </div>
  </div>

  <div class="panel wide">
    <h2 id="l-anims">Animations</h2>
    <div class="cols">
      <div>
        <h3 id="h-react"></h3>
        <div class="checks" id="c-react"></div>
      </div>
      <div>
        <h3 id="h-idle"></h3>
        <div class="checks" id="c-idle"></div>
      </div>
      <div>
        <h3 id="h-effects"></h3>
        <div class="checks" id="c-effects"></div>
        <div class="bulk">
          <button id="b-all"></button>
          <button id="b-none"></button>
        </div>
        <div class="note" id="l-anims-note"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./dashboard.js"></script>
</body>
</html>
